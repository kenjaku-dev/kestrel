<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kestrel</title>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <button id="up-btn" type="button" title="Up one level (Backspace)">Up</button>
        <nav id="crumbs" aria-label="Breadcrumbs"></nav>
        <input
          id="filter"
          type="search"
          placeholder="Filter…"
          aria-label="Filter by name"
          autocomplete="off"
        />
        <select id="sort-key" aria-label="Sort key">
          <option value="name" selected>Name</option>
          <option value="size">Size</option>
          <option value="modified">Date</option>
          <option value="kind">Kind</option>
        </select>
        <button id="sort-dir" type="button" title="Toggle sort direction">↑</button>
        <label id="hidden-wrap" title="Show hidden files">
          <input id="hidden-toggle" type="checkbox" checked /> Hidden
        </label>
      </div>
      <div id="viewport" tabindex="0" role="listbox" aria-label="Directory listing">
        <div id="spacer"></div>
        <div id="rows"></div>
        <div id="state" style="display: none">Loading…</div>
      </div>
      <div id="statusbar">
        <span id="status">Starting…</span>
        <span id="backend-tag"></span>
      </div>
      <div id="perf" style="display: none"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
