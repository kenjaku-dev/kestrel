[package]
name = "kestrel-fs"
description = "Non-blocking, cancellable filesystem engine for the Kestrel file manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Filesystem watching. `macos_kqueue` avoids the FSEvents dependency (and its
# `fsevent-sys` build) while still giving macOS working recursive watching.
notify.workspace = true
# Cross-platform "move to recycle bin" (freedesktop spec on Linux, .Trash on
# macOS, Shell API on Windows). Used for every user-facing delete.
trash.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
