[package]
name = "kestrel"
description = "Kestrel — a lightweight file manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
# Already in the graph through `eframe/persistence`, and the persistence
# feature is on because settings have to survive a restart. Deriving `Serialize`
# on the settings struct is the only reason this is a direct dependency, and it
# adds no packages.
serde = { version = "1", features = ["derive"] }

# The headless filesystem engine. Zero UI dependencies by design.
kestrel-fs = { path = "../kestrel-fs" }

# `default-features = false` keeps wgpu (and its 200-crate graph) out of the
# build entirely; this machine is an Intel HD 530 and we render with glow.
#
# NOTE: `winit/default` must NOT appear here. Cargo hard-errors on a `dep/feat`
# string in a *dependency* feature list. Losing winit's `wayland-csd-adwaita`
# default is fine: Hyprland provides server-side decorations.
eframe = { version = "0.36.2", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
  "links",
  "persistence",
  "wayland",
  "x11",
] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["all_loaders"] }

# Only used to read the compositor's light/dark preference off the live window
# (`winit::window::Window::theme`). `eframe::Frame::info()` exposes no theme
# (only `cpu_usage`), so this is the only reachable route to "system" mode.
# Already a transitive dependency of eframe — adds zero packages to the graph.
winit = { version = "0.30.13", default-features = false }

# `statvfs` for the status bar's free-space meter. `std` has no equivalent.
# Already in the graph via notify -> inotify, so this adds no packages, and
# unlike `libc` its `fs::statvfs` is a safe call -- which is what lets this
# crate keep `unsafe_code = "forbid"`.
rustix = { version = "0.38", default-features = false, features = ["fs"] }

log = "0.4.33"
env_logger = { version = "0.11", default-features = false, features = [
  "auto-color",
  "humantime",
] }

# --- Opening a file with the user's default application --------------------
#
# Two crates, and the split between them is the freedesktop.org one: a MIME
# *type*, and then the *application* registered for that type.
#
# `xdg-mime` 0.4.0 is a parser for the system shared MIME database
# (`/usr/share/mime`), not a table baked into the binary, so this build tracks
# whatever the distribution ships rather than a snapshot of it. It reads the
# glob table (`*.png` -> `image/png`), the magic table (content sniffing), the
# alias table and the subclass graph, and it answers the same question
# `xdg-mime query filetype` does. `mime` is re-exported by it and is a direct
# dependency only because `open` has to name `mime::Mime` in its own signatures.
#
# `freedesktop_entry_parser` 2.0.1 parses the freedesktop *entry* format, which
# is what both `mimeapps.list` and every `.desktop` file are. It is the
# maintained, widely-used parser for exactly that format (nom 8, last release
# Oct 2025); `open` implements the mime-apps-spec *search order* on top of it,
# which is ~70 lines of documented algorithm rather than a file format.
#
# Both are unix-only. The app has no Windows build and `xdg-mime` is
# `#![cfg(any(unix, target_os = "redox"))]`, so the dependency is gated to match
# rather than failing to compile on a platform this app does not target.
[target.'cfg(unix)'.dependencies]
xdg-mime = "0.4.0"
mime = "0.3"
freedesktop_entry_parser = "2.0.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dev-dependencies]
# Real directories for the job tests: a collision, an overwrite and a cancel all
# need an actual filesystem to happen on, not a mock. Same reason kestrel-fs has
# it, and it is a dev-dependency so it never reaches a shipped binary.
tempfile = "3.23.0"

# `ron` for the settings round-trip test, which writes and reads a real file in
# the format `eframe` itself uses. Already in the graph via `eframe/persistence`;
# listed here so the test's dependency is visible rather than inherited.
ron = "0.12"
